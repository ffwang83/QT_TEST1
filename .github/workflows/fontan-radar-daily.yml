name: FONTAN Daily Tender Radar
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and analyze real procurement data
        run: python scripts/fontan_radar_daily.py
      - name: Commit updated radar database
        run: |
          git config user.name 'FONTAN Radar Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fontan-radar/data
          git diff --cached --quiet || git commit -m 'data: refresh FONTAN tender radar'
          git push
