<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FONTAN Government Tender Radar</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#17202a;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--good:#047857;--warn:#b45309;--bad:#b91c1c}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,"Noto Sans TC",Arial,sans-serif;color:var(--text)}.wrap{max-width:1400px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.brand h1{margin:0;font-size:27px}.brand p{margin:6px 0 0;color:var(--muted)}.badge{background:#111827;color:#fff;padding:8px 12px;border-radius:999px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:14px}.stat{padding:18px}.stat .n{font-size:28px;font-weight:800}.stat .l{font-size:13px;color:var(--muted);margin-top:4px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.toolbar input,.toolbar select{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 12px;font-size:14px}.toolbar input{min-width:300px}.grid{display:grid;grid-template-columns:1.8fr 1fr;gap:16px}.card{padding:18px}.card h2{font-size:17px;margin:0 0 14px}.row{border-top:1px solid var(--line);padding:16px 0;cursor:pointer}.row:first-of-type{border-top:0}.rhead{display:flex;justify-content:space-between;gap:15px}.title{font-weight:750;font-size:15px}.score{font-weight:800;font-size:18px}.score.good{color:var(--good)}.score.mid{color:var(--warn)}.score.low{color:var(--bad)}.meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:8px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.tag{background:#f1f5f9;border-radius:999px;padding:4px 8px;font-size:11px;color:#475569}.detail{position:sticky;top:18px;height:max-content}.detail .empty{color:var(--muted);font-size:14px;line-height:1.7}.detail h3{margin:0 0 7px;font-size:20px}.meter{height:8px;background:#eef0f2;border-radius:99px;overflow:hidden;margin:12px 0}.meter span{display:block;height:100%;background:#111827}.section{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.section b{font-size:13px}.section p,.section li{font-size:13px;line-height:1.65;color:#4b5563}.btn{border:0;background:#111827;color:#fff;border-radius:9px;padding:10px 13px;cursor:pointer}.btn.secondary{background:#f3f4f6;color:#111827}.footer{margin-top:18px;color:var(--muted);font-size:11px}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.detail{position:static}.toolbar input{min-width:100%}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div class="brand"><h1>FONTAN Government Tender Radar</h1><p>烽騰政府標案雷達 · MVP v0.1</p></div><div class="badge">INTERNAL · DEMO DATA</div></div>
<div class="stats"><div class="stat"><div class="n" id="count">0</div><div class="l">目前資料筆數</div></div><div class="stat"><div class="n" id="hot">0</div><div class="l">80分以上高價值案件</div></div><div class="stat"><div class="n" id="soon">0</div><div class="l">14天內截止</div></div><div class="stat"><div class="n" id="pipe">NT$ 0萬</div><div class="l">追蹤案件 Pipeline</div></div></div>
<div class="toolbar"><input id="q" placeholder="搜尋標案名稱、機關、關鍵字…"><select id="type"><option value="">全部類型</option><option>政策溝通</option><option>產業推廣</option><option>活動策展</option><option>媒體內容</option><option>地方創生</option></select><select id="min"><option value="0">所有分數</option><option value="60">60+</option><option value="70">70+</option><option value="80">80+</option></select><button class="btn secondary" onclick="resetFilters()">清除篩選</button></div>
<div class="grid"><div class="card"><h2>🔥 今日優先案件</h2><div id="list"></div></div><div class="card detail"><div id="detail" class="empty">點選左側案件查看「烽騰適配度、理由、風險與建議策略」。</div></div></div>
<div class="footer">本頁為第一版前端原型，資料目前為示範資料；尚未串接政府電子採購網、資料庫或 AI API。</div>
</div>
<script>
const tenders=[
{id:1,title:'2027年度政策宣導暨整合行銷計畫',agency:'示範中央機關',budget:280,deadline:'2026-09-15',type:'政策溝通',score:92,reason:['政策內容轉譯與媒體溝通高度符合烽騰能力','預算落在目前建議的80–300萬甜蜜區','可使用既有公部門社群與大型活動案例'],risk:['需確認類似案例年限與資格條件','影音產製量可能造成外包成本壓力'],strategy:'以「政策內容轉譯＋故事化內容＋媒體擴散＋社群」作為核心提案。',status:'研究',tags:['政策宣導','媒體','社群','整合行銷']},
{id:2,title:'地方品牌形象與觀光推廣計畫',agency:'示範市政府觀旅局',budget:180,deadline:'2026-09-20',type:'地方創生',score:87,reason:['地方品牌、觀光、內容與媒體能力高度重疊','可形成可公開展示的代表性案例','活動與內容可採外部專業聯盟模式執行'],risk:['可能涉及大量活動執行','需控制硬體與場務成本'],strategy:'主打「地方故事品牌化」，串接人物、店家、景點、媒體專題與實體活動。',status:'研究',tags:['觀光','地方品牌','內容','活動']},
{id:3,title:'產業創新成果媒體行銷推廣案',agency:'示範產業署',budget:220,deadline:'2026-09-25',type:'產業推廣',score:83,reason:['產業行銷與媒體內容是烽騰既有強項','可連結企業客戶與產業人脈','有利建立「政府推產業、烽騰做品牌」定位'],risk:['需確認企業招募與成果KPI','可能需要較多採訪與影音'],strategy:'以產業案例故事化、專題內容、論壇與企業媒合建立可量化成果。',status:'研究',tags:['產業推廣','企業','媒體','論壇']},
{id:4,title:'年度大型論壇暨系列活動整合執行',agency:'示範部會',budget:350,deadline:'2026-10-02',type:'活動策展',score:74,reason:['你過去具有展覽、論壇與大型活動經驗','可透過合作夥伴降低固定人力需求'],risk:['案值偏大且活動執行成本高','需仔細核算現金流與履約風險'],strategy:'烽騰掌握策略、議程、內容與整體專案管理，場務與製作採專業夥伴執行。',status:'觀察',tags:['論壇','活動','策展']},
{id:5,title:'社群平台日常內容製作與維運',agency:'示範政府機關',budget:95,deadline:'2026-09-28',type:'媒體內容',score:68,reason:['社群內容能力高度符合','可作為政府長期顧問關係入口'],risk:['預算偏低','日常維運可能高度消耗你的時間'],strategy:'除非能標準化製作流程並外包，否則優先度低於大型策略型案件。',status:'觀察',tags:['社群','內容']}
];
const today=new Date('2026-08-23');
function days(d){return Math.ceil((new Date(d)-today)/86400000)}
function scoreClass(s){return s>=80?'good':s>=70?'mid':'low'}
function render(){const q=document.getElementById('q').value.toLowerCase();const type=document.getElementById('type').value;const min=+document.getElementById('min').value;const data=tenders.filter(t=>(!q||(t.title+t.agency+t.tags.join('')).toLowerCase().includes(q))&&(!type||t.type===type)&&t.score>=min).sort((a,b)=>b.score-a.score);document.getElementById('list').innerHTML=data.map(t=>`<div class="row" onclick="show(${t.id})"><div class="rhead"><div><div class="title">${t.title}</div><div class="meta"><span>${t.agency}</span><span>預算 NT$ ${t.budget}萬</span><span>截止 ${t.deadline}</span></div></div><div class="score ${scoreClass(t.score)}">${t.score}</div></div><div class="tags">${t.tags.map(x=>`<span class="tag">${x}</span>`).join('')}</div></div>`).join('')||'<div class="empty">沒有符合條件的案件。</div>';document.getElementById('count').textContent=tenders.length;document.getElementById('hot').textContent=tenders.filter(t=>t.score>=80).length;document.getElementById('soon').textContent=tenders.filter(t=>days(t.deadline)<=14&&days(t.deadline)>=0).length;document.getElementById('pipe').textContent='NT$ '+tenders.filter(t=>t.score>=70).reduce((a,t)=>a+t.budget,0)+'萬'}
function show(id){const t=tenders.find(x=>x.id===id);document.getElementById('detail').innerHTML=`<h3>${t.title}</h3><div class="meta"><span>${t.agency}</span><span>NT$ ${t.budget}萬</span><span>截止 ${t.deadline}</span></div><div class="section"><b>FONTAN FIT SCORE</b><div class="rhead"><strong>${t.score}/100</strong><strong>${t.score>=80?'★★★★★':t.score>=70?'★★★★☆':'★★★☆☆'}</strong></div><div class="meter"><span style="width:${t.score}%"></span></div></div><div class="section"><b>為什麼適合烽騰</b><ul>${t.reason.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="section"><b>主要風險</b><ul>${t.risk.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="section"><b>CEO 建議投標策略</b><p>${t.strategy}</p></div><button class="btn" onclick="alert('MVP：下一版可加入收藏、狀態、備註與 Pipeline CRM。')">加入追蹤</button>`}
function resetFilters(){document.getElementById('q').value='';document.getElementById('type').value='';document.getElementById('min').value='0';render()}document.getElementById('q').addEventListener('input',render);document.getElementById('type').addEventListener('change',render);document.getElementById('min').addEventListener('change',render);render();
</script></body></html>
