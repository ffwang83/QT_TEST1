<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FONTAN 政府標案雷達</title><style>body{margin:0;background:#f5f7fa;color:#17202a;font:14px system-ui,-apple-system,"Noto Sans TC",sans-serif}.wrap{max-width:1500px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:end}.live{color:#087f5b;font-weight:800}.card,.stat{background:#fff;border:1px solid #e5e7eb;border-radius:14px}.card{padding:16px;margin:14px 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar input,.toolbar select,.btn{border:1px solid #e5e7eb;background:#fff;border-radius:9px;padding:9px 11px}.toolbar input{min-width:280px}.btn{cursor:pointer}.primary{background:#111827;color:#fff}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.stat{padding:13px}.stat b{display:block;font-size:24px}.muted{color:#697586;font-size:11px}.grid{display:grid;grid-template-columns:1.65fr .85fr;gap:14px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top}th{color:#697586;background:#fafafa}.title{font-weight:750;line-height:1.45}.tag{display:inline-block;background:#f1f5f9;border-radius:99px;padding:3px 7px;margin:2px;font-size:10px}.good{color:#087f5b;font-weight:800}.mid{color:#b45309;font-weight:800}.bad{color:#b42318;font-weight:800}.ok{background:#ecfdf5;border:1px solid #a7f3d0;padding:10px;border-radius:9px;color:#065f46}.empty{text-align:center;padding:28px;color:#697586}@media(max-width:1000px){.stats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:600px){.wrap{padding:14px}.stats{grid-template-columns:repeat(2,1fr)}.toolbar input{min-width:100%;width:100%}}</style></head><body><div class="wrap"><div class="top"><div><h1>FONTAN Government Tender Radar</h1><p class="muted">烽騰政府標案雷達｜Production Edition</p></div><div class="live">● REAL DATA</div></div><div class="card"><div class="toolbar"><input id="q" placeholder="搜尋：品牌、行銷、政策宣導、媒體、活動、觀光…"><select id="days"><option value="1">今天</option><option value="3">近3日</option><option value="7" selected>近7日</option><option value="14">近14日</option></select><select id="decision"><option value="">全部判斷</option><option value="保留">🔥 優先研究</option><option value="研究">🟡 人工研究</option><option value="排除">🔴 排除</option></select><button class="btn primary" onclick="loadLive()">⚡ 即時抓取</button><button class="btn" onclick="loadSaved()">↻ 載入每日資料庫</button></div><div id="status" class="muted" style="margin-top:10px">正在載入每日資料庫…</div></div><div class="stats"><div class="stat"><b id="total">0</b><span class="muted">案件</span></div><div class="stat"><b id="keep">0</b><span class="muted">🔥 優先研究</span></div><div class="stat"><b id="research">0</b><span class="muted">🟡 人工研究</span></div><div class="stat"><b id="reject">0</b><span class="muted">🔴 排除</span></div><div class="stat"><b id="hot">0</b><span class="muted">80分以上</span></div><div class="stat"><b id="fav">0</b><span class="muted">★ 收藏</span></div></div><div class="grid"><div class="card"><h2>🔥 烽騰今日標案</h2><div style="overflow:auto"><table><thead><tr><th>標案</th><th>機關</th><th>類型</th><th>預算</th><th>Fit</th><th>建議</th><th>★</th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="card"><h3>🧠 烽騰判斷</h3><div id="detail" class="muted">點選案件查看分析。</div></div></div><div class="card"><div class="muted">資料庫由 GitHub Actions 每日自動抓取近7日公開採購資料並去重保存。正式投標前請以政府電子採購網原始公告與招標文件核驗。</div></div></div><script>const API='https://pcc-api.openfun.app';const DB='https://raw.githubusercontent.com/ffwang83/QT_TEST1/master/fontan-radar/data/tenders.json';const RUN='https://raw.githubusercontent.com/ffwang83/QT_TEST1/master/fontan-radar/data/radar-run.json';const POS=['政策宣導','政策溝通','整合行銷','品牌','品牌形象','行銷','媒體','公關','社群','內容','影音','影像','採訪','論壇','策展','觀光','地方創生','產業推廣','產業行銷','青年','文化','活動','人才培訓','展覽','研討會','峰會'];const NEG=['道路','橋梁','土木','營造','清潔','保全','設備採購','機電','空調','消防','工程','車輛','物資採購','純印刷'];let data=[];const favs=()=>JSON.parse(localStorage.getItem('fontan-favs')||'[]');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function money(n){return n?Number(n).toLocaleString('zh-TW'):'—'}function norm(x){let y={...x};y.fit=Number(x.fit)||50;y.decision=x.decision||(y.fit>=80?'保留':y.fit>=50?'研究':'排除');y.key=x.id||((x.agency||'')+'|'+(x.procNo||'')+'|'+(x.title||''));return y}function render(){let q=document.getElementById('q').value.trim().toLowerCase(),d=document.getElementById('decision').value,a=data.filter(x=>(!q||[x.title,x.agency,x.type,x.procNo].join(' ').toLowerCase().includes(q))&&(!d||x.decision===d)).sort((x,y)=>y.fit-x.fit);total.textContent=data.length;keep.textContent=data.filter(x=>x.decision==='保留').length;research.textContent=data.filter(x=>x.decision==='研究').length;reject.textContent=data.filter(x=>x.decision==='排除').length;hot.textContent=data.filter(x=>x.fit>=80).length;fav.textContent=favs().length;rows.innerHTML=a.map(x=>'<tr onclick="show('+data.indexOf(x)+')" style="cursor:pointer"><td><b>'+esc(x.title)+'</b><div class="muted">'+esc(x.procNo||'')+'</div></td><td>'+esc(x.agency)+'</td><td>'+esc(x.type)+'</td><td>'+money(x.budget)+'</td><td class="'+(x.fit>=80?'good':x.fit>=60?'mid':'bad')+'">'+x.fit+'</td><td class="'+(x.decision==='保留'?'good':x.decision==='研究'?'mid':'bad')+'">'+x.decision+'</td><td onclick="event.stopPropagation();toggleFav('+data.indexOf(x)+')">'+(favs().includes(x.key)?'★':'☆')+'</td></tr>').join('')||'<tr><td colspan="7" class="empty">目前沒有符合條件的案件。</td></tr>'}async function loadSaved(){status.textContent='讀取每日自動資料庫…';try{let r=await fetch(DB+'?t='+Date.now());if(!r.ok)throw Error(r.status);data=(await r.json()).map(norm);render();let rr=await fetch(RUN+'?t='+Date.now());let j=rr.ok?await rr.json():{};status.innerHTML='<div class="ok">資料庫：'+data.length+' 筆｜最後同步：'+esc(j.runAt||'尚未執行')+'</div>'}catch(e){status.textContent='資料庫讀取失敗：'+e.message}}async function loadLive(){let n=+document.getElementById('days').value;status.textContent='正在抓取真實公開採購資料…';let all=[];for(let i=0;i<n;i++){let d=new Date();d.setDate(d.getDate()-i);let ds=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');try{let r=await fetch(API+'/api/listbydate?date='+ds);let j=await r.json();all.push(...(j.records||[]).map(x=>({title:x.brief?.title||'',agency:x.unit_name||'',procNo:x.job_number||'',type:x.brief?.type||'',budget:Number(String(x.detail?.['預算金額']||x.detail?.['預算']||'').replace(/[^0-9.]/g,''))||0,raw:x,fit:50,decision:'研究'})))}catch(e){}}data=all;render();status.innerHTML='<div class="ok">即時抓取完成：'+data.length+' 筆。</div>'}function show(i){let x=data[i],t=[x.title,x.agency,x.type,JSON.stringify(x.raw||{})].join(' '),p=POS.filter(k=>t.includes(k)),n=NEG.filter(k=>t.includes(k));detail.innerHTML='<div class="ok"><b>'+esc(x.title)+'</b><br>Fit Score：<strong>'+x.fit+'/100</strong><br>建議：<strong>'+x.decision+'</strong></div><p>正向訊號：'+(p.map(k=>'<span class="tag">'+k+'</span>').join('')||'無')+'</p><p>非核心訊號：'+(n.map(k=>'<span class="tag">'+k+'</span>').join('')||'無')+'</p><p>預算：'+money(x.budget)+'<br>案號：'+esc(x.procNo)+'</p><p><a target="_blank" href="https://web.pcc.gov.tw/">前往政府電子採購網 →</a></p>}function toggleFav(i){let a=favs(),k=data[i].key;a=a.includes(k)?a.filter(v=>v!==k):a.concat(k);localStorage.setItem('fontan-favs',JSON.stringify(a));render()}document.getElementById('q').oninput=render;document.getElementById('decision').onchange=render;loadSaved();</script></body></html>
