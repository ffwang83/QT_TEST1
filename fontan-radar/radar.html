<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FONTAN 政府標案雷達</title><style>:root{--bg:#f5f7fa;--card:#fff;--text:#17202a;--muted:#697586;--line:#e5e7eb;--good:#087f5b;--warn:#b45309;--bad:#b42318;--dark:#111827}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,"Noto Sans TC",sans-serif}.wrap{max-width:1500px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}.brand h1{margin:0;font-size:27px}.brand p{margin:5px 0;color:var(--muted)}.live{background:#e7f7f0;color:var(--good);padding:7px 10px;border-radius:99px;font-size:11px;font-weight:800}.card,.stat{background:#fff;border:1px solid var(--line);border-radius:14px}.card{padding:16px;margin-bottom:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar input,.toolbar select,.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 11px;font-size:13px}.toolbar input{min-width:280px}.btn{cursor:pointer}.primary{background:var(--dark);color:#fff}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}.stat{padding:13px}.stat b{display:block;font-size:24px}.muted{color:var(--muted);font-size:11px}.grid{display:grid;grid-template-columns:1.65fr .85fr;gap:14px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{color:var(--muted);background:#fafafa}.title{font-weight:750;line-height:1.45}.tag{display:inline-block;background:#f1f5f9;border-radius:99px;padding:3px 7px;margin:2px;font-size:10px}.good{color:var(--good);font-weight:800}.mid{color:var(--warn);font-weight:800}.bad{color:var(--bad);font-weight:800}.ok{background:#ecfdf5;border:1px solid #a7f3d0;padding:10px;border-radius:9px;color:#065f46}.empty{text-align:center;padding:28px;color:var(--muted)}a{color:#1d4ed8}.detail h3{margin-top:0}.hidden{display:none}@media(max-width:1000px){.stats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:600px){.wrap{padding:14px}.stats{grid-template-columns:repeat(2,1fr)}.toolbar input{min-width:100%;width:100%}}</style></head><body><div class="wrap"><div class="top"><div class="brand"><h1>FONTAN Government Tender Radar</h1><p>烽騰政府標案雷達｜Production Edition</p></div><div class="live">● REAL DATA</div></div><div class="card"><div class="toolbar"><input id="q" placeholder="搜尋：品牌、行銷、政策宣導、媒體、活動、觀光…"><select id="days"><option value="1">今天</option><option value="3">近3日</option><option value="7" selected>近7日</option><option value="14">近14日</option></select><select id="decision"><option value="">全部判斷</option><option value="保留">🔥 優先研究</option><option value="研究">🟡 人工研究</option><option value="排除">🔴 排除</option></select><button class="btn primary" onclick="loadLive()">⚡ 即時抓取</button><button class="btn" onclick="loadSaved()">↻ 載入每日資料庫</button></div><div id="status" class="muted" style="margin-top:10px">正在載入每日資料庫…</div></div><div class="stats"><div class="stat"><b id="total">0</b><span class="muted">案件</span></div><div class="stat"><b id="keep">0</b><span class="muted">🔥 優先研究</span></div><div class="stat"><b id="research">0</b><span class="muted">🟡 人工研究</span></div><div class="stat"><b id="reject">0</b><span class="muted">🔴 排除</span></div><div class="stat"><b id="hot">0</b><span class="muted">80分以上</span></div><div class="stat"><b id="fav">0</b><span class="muted">★ 收藏</span></div></div><div class="grid"><div class="card"><h2 style="margin-top:0">🔥 烽騰今日標案</h2><div class="tablewrap"><table class="table"><thead><tr><th>標案</th><th>機關</th><th>類型</th><th>預算</th><th>Fit</th><th>建議</th><th>★</th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="card detail"><h3>🧠 烽騰判斷</h3><div id="detail" class="muted">點選左側案件查看分析。</div></div></div><div class="card"><div class="muted">資料庫由 GitHub Actions 每日自動抓取近7日公開採購資料並去重保存。資料來源為 g0v/OpenFun 公開 API，其資料源自政府電子採購網。Fit Score 是烽騰內部決策輔助，不代表得標機率；正式投標前請以原始公告與招標文件核驗。</div></div></div><script>const API='https://pcc-api.openfun.app';const DB='data/tenders.json';const POS=['政策宣導','政策溝通','整合行銷','品牌','品牌形象','行銷','媒體','公關','社群','內容','影音','影像','採訪','論壇','策展','觀光','地方創生','產業推廣','產業行銷','青年','文化','活動','人才培訓','展覽','研討會','峰會'];const NEG=['道路','橋梁','土木','營造','清潔','保全','設備採購','機電','空調','消防','工程','車輛','物資採購','純印刷'];let data=[];const favs=()=>JSON.parse(localStorage.getItem('fontan-favs')||'[]');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function money(n){return n?Number(n).toLocaleString('zh-TW'):'—'}function dstr(i){let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-i);return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')}function calc(r){let t=[r.title,r.agency,r.type,(r.raw?.brief?.title||''),(r.raw?.detail?JSON.stringify(r.raw.detail):'')].join(' '),s=50+Math.min(30,POS.filter(k=>t.includes(k)).length*5)-Math.min(45,NEG.filter(k=>t.includes(k)).length*12);if(r.type==='勞務類')s+=5;return Math.max(0,Math.min(100,s))}function decision(x){if(x.decision)return x.decision;if(x.fit<50||NEG.filter(k=>JSON.stringify(x).includes(k)).length>=2)return'排除';return x.fit>=80?'保留':'研究'}function normalize(x){let y={...x};y.fit=Number(x.fit)||calc(x);y.decision=decision(y);y.key=x.id||((x.agency||'')+'|'+(x.procNo||x.job||'')+'|'+(x.title||''));return y}function filterRows(){let q=document.getElementById('q').value.trim().toLowerCase(),d=document.getElementById('decision').value;return data.filter(x=>(!q||[x.title,x.agency,x.type,x.procNo].join(' ').toLowerCase().includes(q))&&(!d||x.decision===d)).sort((a,b)=>b.fit-a.fit)}function render(){let a=filterRows();total.textContent=data.length;keep.textContent=data.filter(x=>x.decision==='保留').length;research.textContent=data.filter(x=>x.decision==='研究').length;reject.textContent=data.filter(x=>x.decision==='排除').length;hot.textContent=data.filter(x=>x.fit>=80).length;fav.textContent=favs().length;rows.innerHTML=a.map((x,i)=>'<tr onclick="show('+data.indexOf(x)+')" style="cursor:pointer"><td><div class="title">'+esc(x.title)+'</div><div class="muted">'+esc(x.procNo||'')+'</div></td><td>'+esc(x.agency)+'</td><td>'+esc(x.type)+'<br><span class="tag">'+esc(x.category||'')+'</span></td><td>'+money(x.budget)+'</td><td class="'+(x.fit>=80?'good':x.fit>=60?'mid':'bad')+'">'+x.fit+'</td><td class="'+(x.decision==='保留'?'good':x.decision==='研究'?'mid':'bad')+'">'+x.decision+'</td><td onclick="event.stopPropagation();toggleFav('+data.indexOf(x)+')">'+(favs().includes(x.key)?'★':'☆')+'</td></tr>').join('')||'<tr><td colspan="7" class="empty">目前沒有符合條件的案件。</td></tr>'}async function loadSaved(){status.textContent='讀取每日自動資料庫…';try{let r=await fetch(DB+'?t='+Date.now());if(!r.ok)throw Error(r.status);data=(await r.json()).map(normalize);render();let run=await fetch('data/radar-run.json?t='+Date.now());let j=run.ok?await run.json():{};status.innerHTML='<div class="ok">每日資料庫已載入：'+data.length+' 筆。最後自動同步：'+esc(j.runAt||'尚未執行')+'；本輪新增/更新：'+(j.fetchedUnique??'—')+'；資料庫總量：'+(j.totalStored??data.length)+'</div>'}catch(e){status.innerHTML='<div class="bad">無法讀取每日資料庫：'+esc(e.message)+'。可先按「即時抓取」直接取得公開資料。</div>'}}async function loadLive(){let n=+days.value;status.textContent='正在抓取真實公開採購資料…';let all=[],errors=[];for(let i=0;i<n;i++){try{let r=await fetch(API+'/api/listbydate?date='+dstr(i));if(!r.ok)throw Error(r.status);let j=await r.json();all.push(...(j.records||[]).map(x=>{let y={raw:x,title:x.brief?.title||'',agency:x.unit_name||'',procNo:x.job_number||'',type:x.brief?.type||'',budget:Number(String(x.detail?.['預算金額']||x.detail?.['預算']||'').replace(/[^0-9.]/g,''))||0};return normalize(y)}))}catch(e){errors.push(dstr(i))}}let seen=new Set();data=all.filter(x=>{if(seen.has(x.key))return false;seen.add(x.key);return true});render();status.innerHTML='<div class="ok">即時抓取完成：'+data.length+' 筆真實公開案件。'+(errors.length?'失敗日期：'+errors.join(','):'')+'</div>'}function show(i){let x=data[i],t=[x.title,x.agency,x.type,JSON.stringify(x.raw||{})].join(' '),p=POS.filter(k=>t.includes(k)),n=NEG.filter(k=>t.includes(k));detail.innerHTML='<div class="ok"><b>'+esc(x.title)+'</b><br>Fit Score：<strong>'+x.fit+'/100</strong><br>建議：<strong>'+x.decision+'</strong><br>類型：'+esc(x.category||'')+'</div><p><b>正向訊號</b><br>'+(p.length?p.map(k=>'<span class="tag">'+k+'</span>').join(''):'無')+'</p><p><b>非核心訊號</b><br>'+(n.length?n.map(k=>'<span class="tag">'+k+'</span>').join(''):'無')+'</p><p><b>預算：</b>'+money(x.budget)+'<br><b>公告日期：</b>'+esc(x.posted||'')+'<br><b>截止：</b>'+esc(x.deadline||'')+'</p><p><a target="_blank" rel="noopener" href="'+esc(x.sourceUrl||'https://web.pcc.gov.tw/')+'">前往原始公告 →</a></p>'}function toggleFav(i){let a=favs(),k=data[i].key;a=a.includes(k)?a.filter(v=>v!==k):a.concat(k);localStorage.setItem('fontan-favs',JSON.stringify(a));render()}document.getElementById('q').oninput=render;document.getElementById('decision').onchange=render;loadSaved();</script></body></html>
